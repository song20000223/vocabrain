<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#101a33"/>
      <stop offset="55%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="45%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b1"/>
      <feGaussianBlur stdDeviation="42" in="SourceGraphic" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 深色背景 -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- 雨丝 -->
  <g stroke="#93c5fd" stroke-linecap="round" opacity="0.35">
    <line x1="118" y1="70" x2="100" y2="150" stroke-width="4"/>
    <line x1="168" y1="50" x2="154" y2="112" stroke-width="3" opacity="0.7"/>
    <line x1="382" y1="66" x2="400" y2="146" stroke-width="4"/>
    <line x1="432" y1="118" x2="444" y2="176" stroke-width="3" opacity="0.7"/>
    <line x1="356" y1="380" x2="372" y2="448" stroke-width="4"/>
    <line x1="130" y1="384" x2="116" y2="442" stroke-width="3" opacity="0.7"/>
  </g>

  <!-- 中心 V + 雨滴 -->
  <g filter="url(#glow)">
    <path d="M150 148 L256 372 L362 148" fill="none" stroke="url(#beam)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 雨滴悬在 V 尖上 -->
    <path d="M256 96 C256 96 222 148 222 178 a34 34 0 0 0 68 0 C290 148 256 96 256 96 Z" fill="url(#beam)"/>
  </g>

  <!-- V 尖落点的小涟漪 -->
  <ellipse cx="256" cy="402" rx="58" ry="10" fill="none" stroke="#60a5fa" stroke-width="5" opacity="0.5"/>
  <ellipse cx="256" cy="402" rx="26" ry="5" fill="none" stroke="#93c5fd" stroke-width="4" opacity="0.8"/>
</svg>
